name: Labels
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

permissions: {}

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    - name: Apply label from pull request title
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        if [[ "$PR_TITLE" =~ ^(breaking|feat|fix|refactor|upgrade|docs|security|lang-all|internal)(\([[:alnum:]_.-]+\))?(!)?: ]]; then
          title_type="${BASH_REMATCH[1]}"
          breaking="${BASH_REMATCH[3]}"
          case "$title_type" in
            breaking) label=breaking ;;
            feat) label=feature ;;
            fix) label=bug ;;
            *) label="$title_type" ;;
          esac
          [[ -z "$breaking" ]] || label=breaking
          gh pr edit "$PR_NUMBER" --add-label "$label"
        fi
    - run: echo "Done adding labels"
  # Run this after labeler applied labels
  check-labels:
    needs:
      - labeler
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: agilepathway/label-checker@c3d16ad512e7cea5961df85ff2486bb774caf3c5 # v1.6.65
        with:
          one_of: breaking,security,feature,bug,refactor,upgrade,docs,lang-all,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}
