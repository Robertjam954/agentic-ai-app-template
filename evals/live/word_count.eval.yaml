description: Ask Claude to count four words. Skipped unless you pass --live.
tags: [live, tools]
prompt: |
  Use the word_count tool on exactly this text: "one two three four".
  Then answer with the number the tool returned.
expect:
  succeeded: true
  called_tools:
    - name: word_count
      output_includes: "^4$"
  not_called_tools: [current_time]
  reply_includes: "4"
  max_tool_calls: 3
